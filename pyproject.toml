[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geomech"
version = "0.1.0"
description = "Symbolic computation of dynamics on smooth manifolds"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
]

[tool.setuptools.packages.find]
include = ["geomech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E741",   # ambiguous variable name (l, I, O — common in math/physics)
    "E731",   # lambda assignment (used for lazy constants)
    "E701",   # multiple statements on one line (match/case style)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]  # re-exports and version-gated imports are intentional
"examples/*" = ["F401", "E402", "F811"]  # examples are scripts

[tool.ruff.lint.isort]
known-first-party = ["geomech"]
